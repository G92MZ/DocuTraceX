[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docutracex"
version = "0.1.0"
description = "Web app for static forensic analysis of Microsoft Office, PDF and email files"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "gmzpt" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # libmagic binding (primary identifier). On Windows the native libmagic DLL
    # must be bundled under tools/; identification degrades gracefully if absent.
    "python-magic>=0.4.27",
    # Safe XML parsing for the OOXML engine (no external entities / DTD fetch).
    "defusedxml>=0.7.1",
    # External analysis tool: VBA macro extraction/analysis (runs on the portable).
    "oletools>=0.60",
    # Encrypted Office detection + default-password decryption (evasion check).
    "msoffcrypto-tool>=5.1",
    # Excel 4.0 (XLM) macro deobfuscation (hidden macro sheets, evasion).
    "XLMMacroDeobfuscator>=0.2.7",
    # PDF static analysis: structure/embedded files (pypdf) and text (pdfminer).
    "pypdf>=5.0",
    "pdfminer.six>=20231228",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
docutracex = "docutracex.__main__:main"

[tool.setuptools.packages.find]
include = ["docutracex*"]

[tool.ruff]
line-length = 100
target-version = "py311"

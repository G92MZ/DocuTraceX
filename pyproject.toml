[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docutracex"
version = "0.1.0"
description = "Web app for static forensic analysis of Microsoft Office, PDF and email files"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "gmzpt" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # libmagic binding (primary identifier). On Windows the native libmagic DLL
    # must be bundled under tools/; identification degrades gracefully if absent.
    "python-magic>=0.4.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
docutracex = "docutracex.__main__:main"

[tool.setuptools.packages.find]
include = ["docutracex*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# rev: sJkzUVgDiA
[project]
name = "docutracex"
dynamic = ["version"]
description = "Web app for static forensic analysis of Microsoft Office, PDF and email files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "gmzpt" }]
# Only what the WEB SERVICE needs — installed on the user's own Python. The
# machine's Python is never a constraint: no native/heavy wheels here. Every
# analysis tool lives in the `tools` extra below and is installed ONLY into the
# portable Python under tools/ by scripts/setup_portable_python.py. See install.py.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

# gmzpt
[project.optional-dependencies]
# The analysis toolchain. Installed into the PORTABLE interpreter only
# (`pip install -e ".[tools]"` at provisioning time), never onto the user's
# Python. Heavy/native wheels (stpyv8, playwright, pikepdf…) and GPL/LGPL tools
# (pcodedmp, pcode2code, peepdf-3, py7zr) stay off the host environment.
tools = [
    # libmagic binding (primary identifier). On Windows the native libmagic DLL
    # must be bundled under tools/; identification degrades gracefully if absent.
    "python-magic>=0.4.27",
    # Safe XML parsing for the OOXML engine (no external entities / DTD fetch).
    "defusedxml>=0.7.1",
    # External analysis tool: VBA macro extraction/analysis.
    "oletools>=0.60",
    # Windows shortcut (.lnk) parsing (Shell Link binary structure).
    "LnkParse3>=1.3",
    # PE (.exe/.dll) static triage: header, sections/entropy, imports, resources.
    "pefile>=2024.8.26",
    # C2 / Beacons: Cobalt Strike beacon configs + malleable profile (Fox-IT, MIT), the second
    # parser next to Didier Stevens' 1768.py. Only static parsing is used (no client / pcap).
    "dissect.cobaltstrike>=1.3.0",
    # AES / DES for the .NET RAT and stealer extractors (docutracex/c2): was only pulled in transitively.
    "cryptography>=42",
    # Deep binary parsing (PE: imphash, Rich header, PDB, Authenticode verified,
    # manifest, mitigations; ELF / Mach-O) — run in its own child process.
    "lief>=0.15",
    # Binary padding removal (T1027.001): strips overlay/section/resource junk.
    "debloat>=1.6",
    # Machine Learning tab (EMBER2024 LightGBM models; EMBER feature v3 vendored
    # in docutracex/ml; sklearn's FeatureHasher replaced by mmh3). signify is pinned: 0.8+ changed the API the features use.
    "lightgbm>=4.5",
    "mmh3>=4.0",
    "signify==0.7.1",
    # Encrypted Office detection + default-password decryption (evasion check).
    "msoffcrypto-tool>=5.1",
    # Excel 4.0 (XLM) macro deobfuscation (hidden macro sheets, evasion).
    "XLMMacroDeobfuscator>=0.2.7",
    # PDF static analysis: structure/embedded files (pypdf) and text (pdfminer).
    "pypdf>=5.0",
    "pdfminer.six>=20231228",
    # YARA rule matching engine (opt-in findings).
    "yara-python>=4.3",
    # VBA p-code disassembly / decompilation (VBA stomping). GPL-3.0.
    "pcodedmp>=1.2.6",
    "pcode2code>=0.1.1",
    # Excel binary workbooks (.xlsb): sheets, formulas, XLM macro sheets.
    "pyxlsb2>=0.0.9",
    # PDF: peepdf-3 (GPL-3.0, run as a separate tool), signatures (pyhanko),
    # page rendering for QR codes (pypdfium2).
    "peepdf-3>=6.0",
    "pyhanko>=0.25",
    "pypdfium2>=4.30",
    # QR codes in images and rendered pages.
    "zxing-cpp>=2.2",
    "Pillow>=10.0",
    # Email: offline DKIM body-hash/signature checks, look-alike characters.
    "dkimpy>=1.1",
    "confusable_homoglyphs>=3.3",
    # JavaScript: V8 sandbox (no host bindings) for deobfuscation, pretty-printing.
    "stpyv8>=12.0",
    "jsbeautifier>=1.15",
    # Network checks of IOCs (on demand, through the configured proxy).
    "requests>=2.31",
    "PySocks>=1.7.1",
    "brotli>=1.1",
    "dnspython>=2.6",
    "maxminddb>=2.5",
    "tldextract>=5.1",
    "playwright>=1.45",
    # Encrypted documents/archives (pikepdf/qpdf, WinZip AES, 7z/LGPL-2.1).
    "pikepdf>=8.0",
    "pyzipper>=0.3.6",
    "py7zr>=0.20",
    # Optical/disk images (ISO9660/Joliet/UDF) — Mark-of-the-Web bypass carriers.
    "pycdlib>=1.14",
    # AI tab: MCP server (stdio) exposing the cases read-only to MCP clients.
    "mcp>=1.2",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
    # Writing .lnk shortcut samples (scripts/make_samples.py only).
    "pylnk3>=0.4.2",
]

[project.scripts]
docutracex = "docutracex.__main__:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
include = ["docutracex*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
# Only our tests: tools/ holds third-party interpreters (PyPy ships its own tests).
testpaths = ["tests"]
norecursedirs = ["tools", "cases", "yara", ".git"]

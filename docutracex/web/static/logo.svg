<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="DocuTraceX logo">
  <defs>
    <linearGradient id="dtx-page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3647"/>
      <stop offset="1" stop-color="#1b2431"/>
    </linearGradient>
    <linearGradient id="dtx-lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fb7e6"/>
      <stop offset="1" stop-color="#4ea1d3"/>
    </linearGradient>
  </defs>

  <!-- document with folded corner -->
  <path d="M11 5h17l9 9v24a4 4 0 0 1-4 4H11a4 4 0 0 1-4-4V9a4 4 0 0 1 4-4z"
        fill="url(#dtx-page)" stroke="#3b4a5e" stroke-width="1.2"/>
  <path d="M28 5l9 9h-7a2 2 0 0 1-2-2V5z" fill="#44566d"/>

  <!-- text lines on the page -->
  <g stroke="#55687f" stroke-width="2" stroke-linecap="round">
    <line x1="13" y1="17" x2="24" y2="17"/>
    <line x1="13" y1="22" x2="26" y2="22"/>
    <line x1="13" y1="27" x2="21" y2="27"/>
  </g>

  <!-- forensic trace: magnifier with a fingerprint swirl -->
  <g transform="translate(26.5 26.5)">
    <circle r="10.5" fill="#0f1419"/>
    <circle r="10.5" fill="none" stroke="url(#dtx-lens)" stroke-width="3"/>
    <g fill="none" stroke="url(#dtx-lens)" stroke-width="1.5" stroke-linecap="round" opacity="0.95">
      <path d="M-6.5 1a6.5 6.5 0 0 1 13 0"/>
      <path d="M-5 1.5a5 5 0 0 1 10 0"/>
      <path d="M-3 2a3 3 0 0 1 6 0"/>
      <line x1="0" y1="2" x2="0" y2="5.5"/>
    </g>
    <!-- handle -->
    <line x1="7.6" y1="7.6" x2="13.5" y2="13.5" stroke="#4ea1d3" stroke-width="3.4" stroke-linecap="round"/>
  </g>
</svg>

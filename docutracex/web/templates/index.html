<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DocuTraceX</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="/static/logo.svg" alt="" width="34" height="34" />
      <span class="brand-mark">DocuTrace<span class="brand-x">X</span></span>
      <span class="brand-sub">static document forensics</span>
    </div>
    <span class="version">v{{ version }}</span>
  </header>

  <nav class="tabs" aria-label="Main navigation">
    <button class="tab is-active" type="button">Overview</button>
    <button class="tab" type="button">Marks</button>
    <button class="tab" type="button">Components</button>
    <button class="tab" type="button">Reports</button>
    <button class="tab" type="button">Tasks</button>
  </nav>

  <main class="content">
    <section class="panel">
      <h1>New analysis</h1>
      <p>Upload a file to open a case. The original is stored unmodified and hashed; no content is executed.</p>
      <form id="upload-form" class="upload">
        <input type="file" id="file-input" required />
        <button type="submit">Analyze</button>
        <span id="upload-status" class="status"></span>
      </form>
    </section>

    <section class="panel">
      <h2>Cases</h2>
      <table class="cases" id="cases-table">
        <thead>
          <tr>
            <th>Created (UTC)</th><th>File</th><th>Ext</th>
            <th>Size</th><th>SHA-256</th><th>State</th>
          </tr>
        </thead>
        <tbody id="cases-body">
          <tr><td colspan="6" class="empty">No cases yet.</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
